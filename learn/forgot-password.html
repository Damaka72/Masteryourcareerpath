<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Reset Password | Master Your Career Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/learn/assets/learn.css" />
</head>
<body>
  <header class="learn-topbar">
    <div class="container">
      <a href="/" class="learn-logo"><span>M</span>aster Your Career Path</a>
      <div class="learn-nav-right">
        <a href="/">Back to site</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <p class="auth-eyebrow">Classroom</p>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

      <div class="alert" id="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn--gold" id="submit-btn">Send Reset Link</button>
      </form>

      <p class="form-footer-link"><a href="/learn/login">Back to log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/learn/assets/supabase-client.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mycpHideAlert(alertEl);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      const email = document.getElementById('email').value.trim();

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/learn/reset-password`,
      });

      if (error) {
        mycpShowAlert(alertEl, error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
        return;
      }

      mycpShowAlert(alertEl, 'If that email has an account, a reset link is on its way.', 'success');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
    });
  </script>
</body>
</html>
