<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Create Account | Master Your Career Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/learn/assets/learn.css" />
</head>
<body>
  <header class="learn-topbar">
    <div class="container">
      <a href="/" class="learn-logo"><span>M</span>aster Your Career Path</a>
      <div class="learn-nav-right">
        <a href="/">Back to site</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <p class="auth-eyebrow">Classroom</p>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-sub">Sign up to access your courses.</p>

      <div class="alert" id="alert"></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="btn btn--gold" id="submit-btn">Create Account</button>
      </form>

      <p class="form-footer-link">Already have an account? <a href="/learn/login">Log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/learn/assets/supabase-client.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    (async () => {
      const session = await mycpGetSession();
      if (session) window.location.href = '/learn/';
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mycpHideAlert(alertEl);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      const fullName = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: `${window.location.origin}/learn/login`,
        },
      });

      if (error) {
        mycpShowAlert(alertEl, error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
        return;
      }

      // If email confirmation is off, signUp returns an active session immediately.
      if (data.session) {
        window.location.href = '/learn/';
        return;
      }

      mycpShowAlert(alertEl, 'Check your email to confirm your account, then log in.', 'success');
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    });
  </script>
</body>
</html>
