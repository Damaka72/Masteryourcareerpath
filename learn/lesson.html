<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Lesson | Master Your Career Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/learn/assets/learn.css" />
  <style>
    .learn-main { flex: 1; padding: 40px 0 96px; }
    .lesson-crumb { font-size: 0.82rem; color: var(--text-mid); margin-bottom: 10px; }
    .lesson-crumb a { color: var(--navy); font-weight: 600; }
    .lesson-crumb a:hover { text-decoration: underline; }
    .lesson-title {
      font-family: var(--font-display); font-size: clamp(1.6rem, 3.6vw, 2.2rem);
      font-weight: 700; color: var(--navy); margin-bottom: 16px;
    }
    .lesson-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; align-items: start; }
    @media (max-width: 860px) { .lesson-layout { grid-template-columns: 1fr; } }

    .lesson-body {
      background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm);
      padding: 22px 26px; font-size: 0.95rem; color: var(--text-mid); margin-bottom: 28px;
    }
    .video-embed { margin-bottom: 28px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); aspect-ratio: 16/9; }
    .video-embed iframe { width: 100%; height: 100%; border: 0; display: block; }

    .slide-stack { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
    .slide-stack img {
      width: 100%; border-radius: var(--radius); box-shadow: var(--shadow-sm); display: block;
    }
    .slide-counter { text-align: center; font-size: 0.78rem; color: var(--text-mid); margin-top: -10px; }

    .resources-block { margin-bottom: 28px; }
    .resources-block h3 { font-family: var(--font-display); font-size: 1.05rem; color: var(--navy); margin-bottom: 12px; }
    .resource-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm);
      padding: 12px 16px; font-size: 0.88rem; margin-bottom: 8px;
    }
    .resource-row a { color: var(--navy); font-weight: 600; }
    .resource-row a:hover { text-decoration: underline; }

    .complete-btn { width: auto; padding: 12px 26px; }
    .complete-btn.is-done { background: #EAF6EC; color: #1E7B34; border-color: #C3E6CB; }

    .lesson-nav { display: flex; justify-content: space-between; margin-top: 32px; gap: 12px; }
    .lesson-nav a { font-size: 0.88rem; font-weight: 600; color: var(--navy); }
    .lesson-nav a:hover { text-decoration: underline; }
    .lesson-nav .spacer { flex: 1; }

    .sidebar {
      background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      padding: 20px; position: sticky; top: 84px;
    }
    .sidebar h3 { font-family: var(--font-display); font-size: 1rem; color: var(--navy); margin-bottom: 14px; }
    .sidebar-lesson {
      display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 0.85rem;
      color: var(--text-mid);
    }
    .sidebar-lesson.active { color: var(--navy); font-weight: 700; }
    .sidebar-lesson a { color: inherit; flex: 1; }
    .sidebar-check {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--light-grey); display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; color: var(--white);
    }
    .sidebar-check.done { background: var(--gold); border-color: var(--gold); }
  </style>
</head>
<body>
  <header class="learn-topbar">
    <div class="container">
      <a href="/learn/" class="learn-logo"><span>M</span>aster Your Career Path</a>
      <div class="learn-nav-right" id="nav-right"></div>
    </div>
  </header>

  <main class="learn-main">
    <div class="container">
      <div id="content"><p class="learn-loading">Loading lesson…</p></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/learn/assets/supabase-client.js"></script>
  <script src="/learn/assets/course-data.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function renderNav(session, profile) {
      const navRight = document.getElementById('nav-right');
      if (session) {
        navRight.innerHTML = `
          <a href="/learn/">Courses</a>
          <a href="/learn/account">${escapeHtml(profile?.full_name || session.user.email)}</a>
          <a href="#" id="signout-link">Sign out</a>
        `;
        document.getElementById('signout-link').addEventListener('click', (e) => {
          e.preventDefault();
          mycpSignOut();
        });
      } else {
        navRight.innerHTML = `
          <a href="/learn/login">Log in</a>
          <a href="/learn/signup" class="btn btn--gold" style="width:auto;padding:8px 18px;">Sign up</a>
        `;
      }
    }

    function renderMessage(title, bodyHtml) {
      document.getElementById('content').innerHTML = `
        <div class="lesson-body" style="max-width:520px; text-align:center;">
          <h1 class="lesson-title" style="font-size:1.3rem;">${escapeHtml(title)}</h1>
          ${bodyHtml}
        </div>
      `;
    }

    function youTubeEmbedUrl(url) {
      try {
        const u = new URL(url);
        let id = null;
        if (u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
        else if (u.searchParams.get('v')) id = u.searchParams.get('v');
        else if (u.pathname.startsWith('/embed/')) return url;
        if (!id) return null;
        return `https://www.youtube.com/embed/${id}`;
      } catch {
        return null;
      }
    }

    (async () => {
      const path = mycpParseLessonPath();
      if (!path) { renderMessage('Lesson not found', '<p><a href="/learn/">Back to courses</a></p>'); return; }

      const outline = await mycpLoadCourseOutline(path.course);
      const profile = outline.session ? await mycpGetProfile() : null;
      renderNav(outline.session, profile);

      if (!outline.course) {
        renderMessage('Course not found', '<p><a href="/learn/">Back to courses</a></p>');
        return;
      }

      if (outline.modules.length === 0) {
        renderMessage("You're not enrolled yet", `
          <p style="color:var(--text-mid); font-size:0.92rem; margin-top:10px;">
            ${outline.session
              ? 'Get in touch to get access to this course.'
              : 'Log in or create an account, then get in touch to get access.'}
          </p>
          <p style="margin-top:16px;"><a href="/learn/${escapeHtml(outline.course.slug)}">Back to course</a></p>
        `);
        return;
      }

      const flat = mycpFlattenLessons(outline.modules);
      const idx = flat.findIndex((l) => l.moduleSlug === path.module && l.slug === path.lesson);
      if (idx === -1) {
        renderMessage('Lesson not found', `<p><a href="/learn/${escapeHtml(outline.course.slug)}">Back to course</a></p>`);
        return;
      }

      const lesson = flat[idx];
      const prev = flat[idx - 1] || null;
      const next = flat[idx + 1] || null;

      document.title = `${lesson.title} | Master Your Career Path`;

      const { data: resources, error: resErr } = await supabaseClient
        .from('lesson_resources')
        .select('id, title, file_url, kind, sort_order')
        .eq('lesson_id', lesson.id)
        .order('sort_order', { ascending: true });
      if (resErr) console.error(resErr);

      const slides = (resources || []).filter((r) => r.kind === 'slide');
      const files = (resources || []).filter((r) => r.kind !== 'slide');
      const isDone = outline.progressLessonIds.has(lesson.id);
      const embedUrl = lesson.video_url ? youTubeEmbedUrl(lesson.video_url) : null;

      const sidebarHtml = outline.modules.map((m) => `
        <div style="margin-bottom:14px;">
          <div style="font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-mid); margin-bottom:4px;">${escapeHtml(m.title)}</div>
          ${(m.lessons || []).map((l) => {
            const active = m.slug === path.module && l.slug === path.lesson;
            const done = outline.progressLessonIds.has(l.id);
            return `
              <div class="sidebar-lesson ${active ? 'active' : ''}">
                <span class="sidebar-check ${done ? 'done' : ''}">${done ? '✓' : ''}</span>
                <a href="${mycpLessonUrl(outline.course.slug, m.slug, l.slug)}">${escapeHtml(l.title)}</a>
              </div>
            `;
          }).join('')}
        </div>
      `).join('');

      document.getElementById('content').innerHTML = `
        <div class="lesson-layout">
          <div>
            <p class="lesson-crumb"><a href="/learn/${escapeHtml(outline.course.slug)}">${escapeHtml(outline.course.title)}</a> / ${escapeHtml(lesson.moduleTitle)}</p>
            <h1 class="lesson-title">${escapeHtml(lesson.title)}</h1>

            ${embedUrl ? `<div class="video-embed"><iframe src="${embedUrl}" title="${escapeHtml(lesson.title)}" allowfullscreen></iframe></div>` : ''}

            <div class="lesson-body">${escapeHtml(lesson.body || '')}</div>

            ${slides.length ? `
              <div class="slide-stack">
                ${slides.map((s, i) => `<img src="${escapeHtml(s.file_url)}" alt="${escapeHtml(lesson.title)} — slide ${i + 1}" loading="lazy" />`).join('')}
              </div>
              <p class="slide-counter">${slides.length} slide${slides.length === 1 ? '' : 's'}</p>
            ` : ''}

            ${files.length ? `
              <div class="resources-block">
                <h3>Companion resources</h3>
                ${files.map((f) => `
                  <div class="resource-row">
                    <span>📎</span>
                    <a href="${escapeHtml(f.file_url)}" target="_blank" rel="noopener">${escapeHtml(f.title)}</a>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <button class="btn btn--gold complete-btn ${isDone ? 'is-done' : ''}" id="complete-btn">
              ${isDone ? '✓ Completed' : 'Mark as complete'}
            </button>

            <div class="lesson-nav">
              ${prev ? `<a href="${mycpLessonUrl(outline.course.slug, prev.moduleSlug, prev.slug)}">← ${escapeHtml(prev.title)}</a>` : '<span></span>'}
              <span class="spacer"></span>
              ${next ? `<a href="${mycpLessonUrl(outline.course.slug, next.moduleSlug, next.slug)}">${escapeHtml(next.title)} →</a>` : '<span></span>'}
            </div>
          </div>

          <aside class="sidebar">
            <h3>Course progress</h3>
            ${sidebarHtml}
          </aside>
        </div>
      `;

      const completeBtn = document.getElementById('complete-btn');
      completeBtn.addEventListener('click', async () => {
        if (completeBtn.classList.contains('is-done')) return;
        completeBtn.disabled = true;
        completeBtn.textContent = 'Saving…';
        const { error } = await supabaseClient
          .from('lesson_progress')
          .upsert({ user_id: outline.session.user.id, lesson_id: lesson.id }, { onConflict: 'user_id,lesson_id' });
        if (error) {
          console.error(error);
          completeBtn.disabled = false;
          completeBtn.textContent = 'Mark as complete';
          return;
        }
        completeBtn.classList.add('is-done');
        completeBtn.textContent = '✓ Completed';
      });
    })();
  </script>
</body>
</html>
