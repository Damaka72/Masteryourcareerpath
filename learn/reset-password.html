<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Set New Password | Master Your Career Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/learn/assets/learn.css" />
</head>
<body>
  <header class="learn-topbar">
    <div class="container">
      <a href="/" class="learn-logo"><span>M</span>aster Your Career Path</a>
      <div class="learn-nav-right">
        <a href="/">Back to site</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <p class="auth-eyebrow">Classroom</p>
      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>

      <div class="alert" id="alert"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="password_confirm">Confirm password</label>
          <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="btn btn--gold" id="submit-btn">Update Password</button>
      </form>

      <p class="form-footer-link"><a href="/learn/login">Back to log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/learn/assets/supabase-client.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    // Supabase's password-recovery link signs the visitor in via a
    // PASSWORD_RECOVERY auth event so updateUser() below can run.
    let recoveryReady = false;
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
    });

    (async () => {
      // Session may already be present by the time this script runs.
      const session = await mycpGetSession();
      if (session) recoveryReady = true;
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mycpHideAlert(alertEl);

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password_confirm').value;

      if (password !== confirm) {
        mycpShowAlert(alertEl, 'Passwords do not match.', 'error');
        return;
      }
      if (!recoveryReady) {
        mycpShowAlert(alertEl, 'This reset link is invalid or has expired. Request a new one.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      const { error } = await supabaseClient.auth.updateUser({ password });

      if (error) {
        mycpShowAlert(alertEl, error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
        return;
      }

      mycpShowAlert(alertEl, 'Password updated. Redirecting…', 'success');
      setTimeout(() => { window.location.href = '/learn/'; }, 1200);
    });
  </script>
</body>
</html>
