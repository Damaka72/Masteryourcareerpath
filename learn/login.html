<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Log In | Master Your Career Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/learn/assets/learn.css" />
</head>
<body>
  <header class="learn-topbar">
    <div class="container">
      <a href="/" class="learn-logo"><span>M</span>aster Your Career Path</a>
      <div class="learn-nav-right">
        <a href="/">Back to site</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <p class="auth-eyebrow">Classroom</p>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to continue your course.</p>

      <div class="alert" id="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn--gold" id="submit-btn">Log In</button>
      </form>

      <p class="form-footer-link"><a href="/learn/forgot-password">Forgot your password?</a></p>
      <p class="form-footer-link">New here? <a href="/learn/signup">Create an account</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/learn/assets/supabase-client.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    function redirectTarget() {
      const params = new URLSearchParams(window.location.search);
      const target = params.get('redirect');
      return target && target.startsWith('/learn/') ? target : '/learn/';
    }

    (async () => {
      const session = await mycpGetSession();
      if (session) window.location.href = redirectTarget();
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mycpHideAlert(alertEl);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        mycpShowAlert(alertEl, error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
        return;
      }

      window.location.href = redirectTarget();
    });
  </script>
</body>
</html>
